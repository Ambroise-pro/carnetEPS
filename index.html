<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10261f">
<title>EPS Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#home" aria-label="EPS Manager, tableau de bord"><span class="logo" aria-hidden="true">E</span><span class="brand-name">EPS Manager</span></a>
  <nav aria-label="Navigation principale"></nav>
</aside>
<main>
  <header class="topbar">
    <div class="heading">
      <time></time>
      <h1></h1>
    </div>
    <div class="actions">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" placeholder="Élève, classe, séance…" aria-label="Rechercher" autocomplete="off">
      </label>
      <a class="btn primary" href="#sessions">+ Nouvelle séance</a>
    </div>
  </header>
  <section id="view"></section>
</main>
<p role="status" class="toast" aria-live="polite"></p>
<script type="module" src="app.js"></script>
</body>
</html>
